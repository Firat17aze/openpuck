name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like OpenPuck to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought about (optional)
