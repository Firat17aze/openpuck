name: PR title

# PRs are squash-merged, so the PR title becomes the commit message that
# release-please reads. It must be a Conventional Commit.
# The title comes from the event payload, so plain pull_request (no secrets,
# read-only token, also for forks) is enough; no need for pull_request_target.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# A newer push to the same branch or PR supersedes runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read  # read the PR title

jobs:
  lint:
    name: Conventional Commit title
    runs-on: ubuntu-26.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
